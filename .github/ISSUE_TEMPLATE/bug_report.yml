name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include secrets or private workspace data.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I am using the latest Busabase release.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Self-hosted server
        - Desktop app
        - Mobile app
        - CLI
        - SDK or API
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output from `npx busabase --version`, app version, or commit SHA.
      placeholder: 0.19.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Busabase with ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, database mode, and deployment method.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials, tokens, personal data, and private workspace content.
      render: shell
