# Post-merge pipeline on `main`.
#
# Releases are gated by ci-pr.yml before they land, so this is confirmation
# rather than the gate: it catches anything that only shows up once a change is
# actually on `main`, and it is where the benchmark runs (too slow to make every
# pull request wait on it).
#
# It does NOT gate publish-npm.yml or docker.yml — those trigger on the same
# push and run alongside this. That is exactly why the pull-request gate has to
# be the real one.
name: CI (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
    # The coverage job commits the refreshed badge; without granting it here,
    # GitHub rejects the whole run at startup (startup_failure, zero jobs)
    # rather than just failing that one job — every push to main has hit this.
    permissions:
      contents: write
    with:
      run-benchmark: true
    secrets: inherit
