# Pull-request pipeline. Merging a PR into `main` is what publishes to npm
# (publish-npm.yml), so this is the gate that stands in front of a release —
# not a formality that runs beside it.
#
# `ci-ok` is the ONLY required status check on `main`. Requiring the individual
# jobs instead would mean editing branch protection every time a job is added or
# renamed.
#
# The coverage job refreshes the badge on a `release/*` branch and commits it,
# which makes that commit the PR's new HEAD — and branch protection evaluates
# required checks against HEAD. That push is made with GITHUB_TOKEN, and GitHub
# never starts a workflow run for those, so nothing reports `ci-ok` on it and
# the PR sits "Expected — waiting for status" forever. The `ci-ok` job below
# therefore reports the check on that commit itself, once every job in the
# suite has actually succeeded.
#
# There is deliberately no `paths-ignore` here. Anything that excuses this
# workflow from running also excuses it from reporting the required check —
# GitHub reports nothing at all for a path-filtered skip — so a badge-only PR
# would deadlock exactly the way the bot commit used to. Running the full
# suite for an SVG is the cheaper mistake.
name: CI (pull request)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
    # The coverage job commits the refreshed badge onto release/* branches.
    permissions:
      contents: write
    secrets: inherit

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks]
    permissions:
      # To report `ci-ok` on the coverage-badge commit (see below).
      statuses: write
    # `always()` so a failed dependency still reports a (failing) result rather
    # than leaving the required check unreported and the PR stuck.
    if: always()
    steps:
      - name: Fail unless every check succeeded
        run: |
          result='${{ needs.checks.result }}'
          echo "checks: $result"
          [ "$result" = "success" ]
      # Only reachable once the step above passed, which is the whole point:
      # the badge commit inherits `ci-ok` from a parent whose suite is green,
      # and its only delta is a generated SVG. Waving it through earlier — from
      # a `push`-triggered workflow racing the suite — would let a release
      # merge, and publish to npm, while e2e was still running.
      - name: Report ci-ok on the coverage-badge commit
        if: needs.checks.outputs.badge-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_SHA: ${{ needs.checks.outputs.badge-sha }}
        run: |
          echo "Reporting ci-ok on $BADGE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${BADGE_SHA}" \
            -f state=success \
            -f context=ci-ok \
            -f description="Inherited from the verified parent; delta is the generated badge." \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
